name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayon_owner
          POSTGRES_PASSWORD: relayon_owner
          POSTGRES_DB: relayon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relayon_owner -d relayon" --health-interval 5s --health-retries 10
      postgres-vault:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayon_vault
          POSTGRES_PASSWORD: relayon_vault
          POSTGRES_DB: relayon_vault
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U relayon_vault -d relayon_vault" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint, typecheck, test, build (integration tests use the service containers)
        run: pnpm turbo run lint typecheck test build
        env:
          TEST_DATABASE_MIGRATE_URL: postgres://relayon_owner:relayon_owner@localhost:5432/relayon
          TEST_DATABASE_URL: postgres://relayon_app:relayon_app@localhost:5432/relayon
          TEST_EXECUTOR_DATABASE_URL: postgres://relayon_executor_ro:relayon_executor_ro@localhost:5432/relayon
          TEST_VAULT_DATABASE_MIGRATE_URL: postgres://relayon_vault:relayon_vault@localhost:5433/relayon_vault
      - name: security suite (§11.16)
        run: pnpm test:security --force
        env:
          TEST_DATABASE_MIGRATE_URL: postgres://relayon_owner:relayon_owner@localhost:5432/relayon
          TEST_DATABASE_URL: postgres://relayon_app:relayon_app@localhost:5432/relayon
          TEST_EXECUTOR_DATABASE_URL: postgres://relayon_executor_ro:relayon_executor_ro@localhost:5432/relayon
          TEST_VAULT_DATABASE_MIGRATE_URL: postgres://relayon_vault:relayon_vault@localhost:5433/relayon_vault
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level high --prod

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation repos need a (free) licence key: https://gitleaks.io
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --user semgrep==1.186.0
      - run: semgrep scan --config .semgrep/ --error --metrics=off

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
